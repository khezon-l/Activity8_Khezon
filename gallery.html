
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khezon's Creatives - Gallery</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow: hidden;
      width: 100%;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: url('79df9a705ca8cc2af87d75c179c04363.jpg') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      background: #222;
      color: white;
      padding: 16px 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 24px;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    nav a {
      text-decoration: none;
      color: white;
      background: #3a3a3a;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      position: relative;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background: #4a4a4a;
    }

    nav a.active {
      background: #444;
      color: #FFD700;
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: #FFD700;
      border-radius: 2px;
    }

    .content-card {
      background: white;
      border-radius: 20px;
      width: 90%;
      max-width: 800px;
      height: 480px;
      margin: 0 auto;
      padding: 25px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      text-transform: uppercase;
      margin: 0 0 22px 0;
      font-size: 20px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 75px);
      justify-content: center;
      gap: 15px 25px;
      margin: 0 auto;
    }

    .photo-grid img {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 4px solid #222222;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .photo-grid img:hover {
      transform: scale(1.08);
    }

    footer {
      background: black;
      color: white;
      padding: 12px;
      font-size: 12px;
      width: 100%;
    }

    @media (max-width: 480px) {
      html, body {
        overflow: auto;
        min-height: 100vh;
        height: auto;
      }

      .content-card {
        height: auto;
        min-height: 420px;
        padding: 25px 10px;
        margin: 25px auto;
      }

      .photo-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px 8px;
        width: 100%;
        max-width: 320px;
      }

      .photo-grid img {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        border-width: 3px;
      }

      .brand {
        font-size: 19px;
      }

      nav {
        gap: 5px;
      }

      nav a {
        padding: 8px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
